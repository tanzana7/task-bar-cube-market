<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-site-verification" content="85Yim27xrDF7ct6CIeLhcyKc_ri2UnD2xfkwGu5aA9w" />
  <title>Task Bar Cube Market | アイテム検索・Steam価格</title>
  <meta name="description" content="Task Bar CubeのSteam Community Market出品を検索・価格順に比較できる非公式サイト。" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://task-bar-cube-market.pages.dev/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Task Bar Cube Market" />
  <meta property="og:description" content="Task Bar CubeのSteamマーケットを見やすく検索。" />
  <meta property="og:url" content="https://task-bar-cube-market.pages.dev/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header"><div class="shell header-row"><a class="brand" href="/" aria-label="Task Bar Cube Market ホーム"><span class="brand-mark" aria-hidden="true">▣</span><span>Task Bar Cube <strong>Market</strong></span></a><a class="header-link" href="https://steamcommunity.com/market/search?appid=5084200" target="_blank" rel="noopener noreferrer">Steam Market ↗</a></div></header>
  <main class="shell">
    <div class="intro"><p class="eyebrow">UNOFFICIAL MARKET BROWSER</p><h1>欲しいアイテムの相場を、すぐに。</h1><p class="intro-copy">Task Bar CubeのSteam出品を検索・比較。</p></div>
    <section class="market" aria-label="アイテム一覧">
      <div class="controls"><label class="search"><span class="search-icon" aria-hidden="true">⌕</span><span class="sr-only">アイテム名で検索</span><input id="search" type="search" placeholder="アイテム名で検索" autocomplete="off" /></label><label class="sort"><span class="sr-only">通貨</span><select id="currency"><option value="JPY">JPY</option><option value="USD">USD</option></select></label><label class="sort"><span class="sr-only">並び替え</span><select id="sort"><option value="price-asc">価格が安い順</option><option value="price-desc">価格が高い順</option><option value="name">名前順</option></select></label></div>
      <div class="list-head"><span id="result-count">読み込み中</span><span id="updated-at">更新日時 —</span></div>
      <div id="status" class="status" role="status">マーケットデータを読み込んでいます…</div>
      <div id="items" class="items" hidden></div>
    </section>
    <p class="market-note">価格は取得時点の最安出品価格です。購入時はSteamでご確認ください。</p>
  </main>
  <footer class="site-footer"><div class="shell footer-row"><span>Task Bar Cube Market · 非公式ファンサイト</span><span>Valveおよびゲーム開発元とは無関係です。 <a href="/privacy.html">プライバシー</a></span></div></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

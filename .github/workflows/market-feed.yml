name: Update approved TBC market source

on:
  workflow_dispatch:
    inputs:
      resume_after_review:
        description: Previous failure and persisted request state have been reviewed and recovered
        type: boolean
        default: false
      factual_replay:
        description: Validate and publish only the committed sanitized TBC observations (no Steam request)
        type: boolean
        default: false
  repository_dispatch:
    types: [tbc-market-feed-updated]
  # The direct Steam source additionally requires its collection gate and rights reference.
  # Neither source is enabled by adding this workflow; repository variables default to disabled.
  schedule:
    - cron: '23 2,8,14,20 * * *'

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: >-
      inputs.factual_replay != true &&
      vars.TBCM_FEED_ENABLED == 'true' && vars.TBCM_FEED_RIGHTS_REFERENCE != '' &&
      ((vars.TBCM_MARKET_SOURCE == 'query-action' && vars.STEAM_MARKET_COLLECTION_ALLOWED == 'true') ||
      (vars.TBCM_MARKET_SOURCE != 'query-action' && vars.TBCM_FEED_URL != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      TBCM_FEED_ENABLED: ${{ vars.TBCM_FEED_ENABLED }}
      TBCM_FEED_URL: ${{ vars.TBCM_FEED_URL }}
      TBCM_FEED_RIGHTS_REFERENCE: ${{ vars.TBCM_FEED_RIGHTS_REFERENCE }}
      TBCM_FEED_PROVENANCE: ${{ vars.TBCM_FEED_PROVENANCE || 'Configured TBC market feed' }}
      STEAM_MARKET_COLLECTION_ALLOWED: ${{ vars.STEAM_MARKET_COLLECTION_ALLOWED }}
      STEAM_MIN_INTERVAL_MS: '15000'
      STEAM_MAX_REQUESTS_PER_RUN: '6'
      STEAM_MAX_REQUESTS_PER_DAY: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Block automatic Steam access after an unsuccessful source run
        if: vars.TBCM_MARKET_SOURCE == 'query-action'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_AFTER_REVIEW: ${{ inputs.resume_after_review }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && process.env.RESUME_AFTER_REVIEW === 'true') process.exit(0);
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/market-feed.yml/runs?per_page=10`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000), redirect: 'error'
          });
          if (!response.ok) throw new Error('Could not verify previous source run; no Steam request permitted');
          const previous = (await response.json()).workflow_runs.find(run => String(run.id) !== process.env.GITHUB_RUN_ID);
          if (previous && !['success', 'skipped'].includes(previous.conclusion)) {
            throw new Error('Previous source run needs manual review; restore recovery state before resuming');
          }
          NODE
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # Event payloads cannot substitute a URL, timestamp, rights flag or shell command.
      - name: Fetch, validate, merge, publish and verify Pages
        if: vars.TBCM_MARKET_SOURCE != 'query-action'
        run: npm run market:feed -- --once
      - name: Collect bounded USD observations and publish references
        if: vars.TBCM_MARKET_SOURCE == 'query-action'
        run: npm run market:source -- --live --max-pages 6 --publish
      - name: Preserve recovery state when collection or publication fails
        if: failure() && vars.TBCM_MARKET_SOURCE == 'query-action'
        uses: actions/upload-artifact@v4
        with:
          name: tbc-source-recovery-${{ github.run_id }}
          path: |
            .market/steam-collection-state.json
            .market/query-action-observations-5084200.json
          include-hidden-files: true
          retention-days: 7

  factual-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.factual_replay == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # The fixed, sanitized store is already in Git. This path never contacts Steam
      # and never turns an unverified subtotal into the canonical USD price history.
      - name: Replay factual observations and verify Pages if changed
        run: >-
          npm run market:source -- --saved-store
          .market/query-action-observations-5084200.json
          --publish --publish-factual-observations --include-steam-images

name: Validate and refresh market snapshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixture validation or approved live collection
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - live
          - query-action
          - publish-query-action
      publish_query_action_rights_confirmed:
        description: I have independently confirmed rights to publish this TBC observation data (this does not grant Valve permission)
        required: true
        default: false
        type: boolean
      query_action_target:
        description: queryAction validation target (does not affect the production snapshot)
        required: true
        default: tbh
        type: choice
        options:
          - tbh
          - cube
      query_action_currency_id:
        description: Explicit Steam request currency ID (1 USD, 8 JPY)
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '8'
      query_action_max_pages:
        description: Maximum requests in this manually started batch (1-6)
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # All collection tests inject fixture responses; this job makes no Steam request.
      - run: npm run market:validate
      - run: npm run build

  live:
    if: ${{ inputs.mode == 'live' }}
    needs: fixture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STEAM_MARKET_COLLECTION_ALLOWED: ${{ vars.STEAM_MARKET_COLLECTION_ALLOWED }}
      STEAM_MIN_INTERVAL_MS: ${{ vars.STEAM_MIN_INTERVAL_MS || '15000' }}
      STEAM_MAX_REQUESTS_PER_RUN: ${{ vars.STEAM_MAX_REQUESTS_PER_RUN || '6' }}
      STEAM_MAX_REQUESTS_PER_DAY: ${{ vars.STEAM_MAX_REQUESTS_PER_DAY || '24' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require documented permission
        run: test "$STEAM_MARKET_COLLECTION_ALLOWED" = true
      - run: npm ci
      - name: Collect USD market snapshot
        id: collect
        continue-on-error: true
        run: node scripts/steam-market.mjs --live
      - name: Validate market and history caches
        id: validate
        if: steps.collect.outcome == 'success'
        run: node scripts/steam-market.mjs --validate-cache
      - name: Commit only verified market changes
        if: always() && steps.collect.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git add .market/steam-collection-state.json public/market-usd.json public/history public/market-rankings.json
          if git diff --cached --quiet -- .market/steam-collection-state.json public/market-usd.json public/history public/market-rankings.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update verified Steam market snapshots"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Persist request budget and stop state after failure
        if: always() && (steps.collect.outcome == 'failure' || steps.validate.outcome == 'failure')
        run: |
          git add .market/steam-collection-state.json
          if git diff --cached --quiet -- .market/steam-collection-state.json; then
            echo "No request state changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Persist Steam request stop state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Fail when collection or validation failed
        if: always() && (steps.collect.outcome == 'failure' || steps.validate.outcome == 'failure')
        run: exit 1

  query-action:
    if: ${{ inputs.mode == 'query-action' }}
    needs: fixture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STEAM_MARKET_COLLECTION_ALLOWED: ${{ vars.STEAM_MARKET_COLLECTION_ALLOWED }}
      STEAM_MIN_INTERVAL_MS: ${{ vars.STEAM_MIN_INTERVAL_MS || '15000' }}
      STEAM_MAX_REQUESTS_PER_RUN: ${{ vars.STEAM_MAX_REQUESTS_PER_RUN || '6' }}
      STEAM_MAX_REQUESTS_PER_DAY: ${{ vars.STEAM_MAX_REQUESTS_PER_DAY || '24' }}
      QUERY_ACTION_TARGET: ${{ inputs.query_action_target }}
      QUERY_ACTION_CURRENCY_ID: ${{ inputs.query_action_currency_id }}
      QUERY_ACTION_MAX_PAGES: ${{ inputs.query_action_max_pages }}
      QUERY_ACTION_APPID: ${{ inputs.query_action_target == 'cube' && '5084200' || '3678970' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require documented permission
        run: test "$STEAM_MARKET_COLLECTION_ALLOWED" = true
      - name: Collect a bounded queryAction batch
        id: collect
        continue-on-error: true
        run: >-
          node scripts/query-action-collector.mjs --live
          --target="$QUERY_ACTION_TARGET"
          --request-currency-id="$QUERY_ACTION_CURRENCY_ID"
          --max-pages="$QUERY_ACTION_MAX_PAGES"
      - name: Persist request budget and private observations only
        if: always()
        run: |
          git add .market/steam-collection-state.json
          STORE=".market/query-action-observations-$QUERY_ACTION_APPID.json"
          if test -f "$STORE"; then git add "$STORE"; fi
          if git diff --cached --quiet; then
            echo "No private queryAction state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Save bounded queryAction observations"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Fail when collection failed
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1

  publish-query-action:
    if: ${{ inputs.mode == 'publish-query-action' }}
    needs: fixture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH_QUERY_ACTION_RIGHTS_CONFIRMED: ${{ inputs.publish_query_action_rights_confirmed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require operator rights confirmation
        run: test "$PUBLISH_QUERY_ACTION_RIGHTS_CONFIRMED" = true
      - run: npm ci
      - name: Validate, publish isolated reference observations, and verify Cloudflare Pages
        run: >-
          npm run market:publish --
          --input .market/query-action-observations-5084200.json
          --provenance "Validated persisted TBC queryAction observations"
          --publish --rights-confirmed
